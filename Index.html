<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BigBackWise</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      min-height: 100%;
      background: #0f0f1a;
      color: #e8e8f0;
      font-family: 'DM Sans', 'Segoe UI', sans-serif;
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
    }
    #root { min-height: 100%; }

    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pulse  { 0%,100%{opacity:.5} 50%{opacity:.9} }

    .fade-in { animation: fadeIn 0.3s ease; }

    .skeleton {
      background: linear-gradient(90deg,rgba(255,255,255,0.04) 25%,rgba(255,255,255,0.09) 50%,rgba(255,255,255,0.04) 75%);
      background-size: 200% 100%;
      animation: pulse 1.4s ease infinite;
      border-radius: 10px;
    }

    #top-header {
      position: sticky; top: 0; z-index: 40;
      background: #0f0f1a;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      padding: 12px 16px 10px;
      padding-top: calc(12px + env(safe-area-inset-top, 0px));
    }

    #bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
      background: #13131f;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    #bottom-nav button {
      flex: 1; background: none; border: none; cursor: pointer;
      padding: 10px 4px 8px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      color: #555; transition: color 0.18s; position: relative;
      -webkit-tap-highlight-color: transparent;
    }
    #bottom-nav button.active { color: #FF6B6B; }
    #bottom-nav button span.icon { font-size: 20px; line-height: 1; }
    #bottom-nav button span.label { font-size: 10px; font-weight: 600; font-family: 'DM Sans', sans-serif; }
    #bottom-nav .badge {
      position: absolute; top: 7px; left: calc(50% + 7px);
      min-width: 15px; height: 15px; border-radius: 8px;
      background: #FF6B6B; color: #fff;
      font-size: 8px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      padding: 0 3px;
    }

    #fab {
      position: fixed; right: 18px;
      bottom: calc(72px + env(safe-area-inset-bottom, 0px));
      z-index: 39;
      width: 54px; height: 54px; border-radius: 50%;
      background: linear-gradient(135deg, #FF6B6B, #FF8E8E);
      border: none; color: #fff; font-size: 28px; line-height: 1;
      cursor: pointer; box-shadow: 0 4px 18px rgba(255,107,107,0.45);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    #fab:active { transform: scale(0.93); }
    #fab:disabled { opacity: 0.4; cursor: not-allowed; }

    #content { max-width: 680px; margin: 0 auto; padding: 14px 16px 100px; }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; padding: 14px; transition: background 0.2s;
    }

    .btn {
      border: none; cursor: pointer; border-radius: 12px;
      font-weight: 600; font-size: 14px; padding: 10px 18px;
      transition: opacity 0.15s, transform 0.15s; font-family: inherit;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg,#FF6B6B,#FF8E8E); color:#fff; }
    .btn-ghost   { background: rgba(255,255,255,0.08); color:#ccc; }
    .btn-danger  { background: rgba(255,80,80,0.14); color:#ff6b6b; }
    .btn-teal    { background: rgba(78,205,196,0.15); color:#4ECDC4; }

    .input {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; padding: 11px 14px;
      color: #e8e8f0; font-size: 16px;
      font-family: inherit; width: 100%; outline: none;
      transition: border-color 0.18s; -webkit-appearance: none;
    }
    .input:focus { border-color: rgba(255,107,107,0.55); }
    select.input option { background: #1a1a2e; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 100; display: flex; align-items: flex-end; justify-content: center;
    }
    .modal {
      background: #161628; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 22px 22px 0 0; padding: 22px 20px;
      padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
      width: 100%; max-width: 540px; max-height: 92vh;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
    }

    .label {
      font-size: 11px; font-weight: 700; color: #777;
      text-transform: uppercase; letter-spacing: 0.07em;
      margin-bottom: 7px; display: block;
    }
    .toggle {
      width: 40px; height: 22px; border-radius: 11px;
      background: rgba(255,255,255,0.1);
      cursor: pointer; position: relative; border: none;
      transition: background 0.2s; flex-shrink: 0;
    }
    .toggle.on { background: linear-gradient(135deg,#4ECDC4,#44B8B0); }
    .toggle-thumb {
      position: absolute; width: 16px; height: 16px;
      border-radius: 50%; background: #fff;
      top: 3px; left: 3px; transition: left 0.2s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3); pointer-events: none;
    }
    .toggle.on .toggle-thumb { left: 21px; }

    .serving-badge {
      font-size: 10px; font-weight: 700; padding: 2px 7px;
      border-radius: 10px; background: rgba(255,230,109,0.15); color: #FFE66D;
    }
    .serving-ctrl {
      display: flex; align-items: center;
      background: rgba(255,255,255,0.08); border-radius: 8px; overflow: hidden;
    }
    .serving-btn {
      background: none; border: none; color: #ccc; font-size: 18px;
      width: 34px; height: 34px; cursor: pointer; font-weight: 700;
      display: flex; align-items: center; justify-content: center; font-family: inherit;
    }
    .serving-btn:active { background: rgba(255,255,255,0.12); }
    .serving-val { font-size: 14px; font-weight: 700; color: #fff; min-width: 28px; text-align: center; }

    .error-banner {
      margin: 0 0 12px; padding: 10px 14px;
      background: rgba(255,80,80,0.1); border: 1px solid rgba(255,80,80,0.3);
      border-radius: 12px; font-size: 13px; color: #ff8080;
      display: flex; justify-content: space-between; align-items: center;
    }

    .agenda-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 13px 14px; border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
    }
    .agenda-item.discussed { background: rgba(78,205,196,0.04); border-color: rgba(78,205,196,0.12); }
    .agenda-check {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid #444; background: transparent;
      cursor: pointer; flex-shrink: 0; margin-top: 1px;
      display: flex; align-items: center; justify-content: center; transition: all 0.18s;
    }
    .agenda-check.on { background: #4ECDC4; border-color: #4ECDC4; }

    .notif-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 14px; border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
      transition: background 0.15s;
    }
    .notif-item.unread { background: rgba(255,107,107,0.06); border-color: rgba(255,107,107,0.15); }

    .hide-scroll::-webkit-scrollbar { display: none; }
    .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ── Config ────────────────────────────────────────────────────────────────
    const SUPABASE_URL  = "https://tqkimzplwikftvkkogih.supabase.co";
    const SUPABASE_KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxa2ltenBsd2lrZnR2a2tvZ2loIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzNzQzNjMsImV4cCI6MjA4Njk1MDM2M30.BInx6X4wqrL3ZeytYG9PSsKqGNl7WRCgNn6RPZt90OY";
    const EDGE_FN_URL   = `${SUPABASE_URL}/functions/v1/notify-expense`;
    const VAPID_PUBLIC  = "BB7_-0heHFVEjU1OdOXqxlrZ6zvndA1OHc8DrG0ceL1XoHZadMLZj7B1H2ppUii35DlFN0eGaaX0DFGYPsBhZO4";

    const BASE_HDR = {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      Prefer: "return=representation",
    };

    async function sbFetch(path, opts = {}) {
      const { extraHeaders = {}, ...rest } = opts;
      const r = await fetch(`${SUPABASE_URL}/rest/v1${path}`, { headers: { ...BASE_HDR, ...extraHeaders }, ...rest });
      if (!r.ok) throw new Error(`Supabase ${r.status}: ${await r.text()}`);
      const t = await r.text();
      return t ? JSON.parse(t) : null;
    }

    // ── Push helpers ──────────────────────────────────────────────────────────
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64  = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const raw     = window.atob(base64);
      return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
    }

    async function registerPush(friendName) {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return null;
      const reg  = await navigator.serviceWorker.ready;
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') return null;
      const sub  = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC),
      });
      const j = sub.toJSON();
      await sbFetch("/push_subscriptions", {
        method: "POST",
        extraHeaders: { Prefer: "resolution=merge-duplicates,return=representation" },
        body: JSON.stringify({
          friend_name: friendName,
          endpoint:    j.endpoint,
          p256dh:      j.keys.p256dh,
          auth:        j.keys.auth,
        }),
      });
      return sub;
    }

    async function unregisterPush() {
      if (!('serviceWorker' in navigator)) return;
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (sub) {
        await sbFetch(`/push_subscriptions?endpoint=eq.${encodeURIComponent(sub.endpoint)}`, {
          method: "DELETE", extraHeaders: { Prefer: "" },
        });
        await sub.unsubscribe();
      }
    }

    async function getPushSub() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return null;
      try {
        const reg = await navigator.serviceWorker.ready;
        return await reg.pushManager.getSubscription();
      } catch { return null; }
    }

    async function triggerNotify(type, record, actor, participants) {
      try {
        await fetch(EDGE_FN_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${SUPABASE_KEY}` },
          body: JSON.stringify({ type, record, actor, participants }),
        });
      } catch (e) { console.warn("notify failed", e); }
    }

    // ── Constants ─────────────────────────────────────────────────────────────
    const COLORS = ["#FF6B6B","#4ECDC4","#FFE66D","#A8E6CF","#FF8B94","#B8B8FF"];
    const getColor = (name, friends) => COLORS[Math.max(0, friends.indexOf(name)) % COLORS.length];

    // ── Sub-components ────────────────────────────────────────────────────────
    function Avatar({ name, friends, size = 36 }) {
      const c = getColor(name, friends);
      return (
        <div style={{ width:size, height:size, borderRadius:"50%", background:c,
          display:"flex", alignItems:"center", justifyContent:"center",
          fontWeight:700, fontSize:size*0.38, color:"#1a1a2e", flexShrink:0,
          border:"2px solid rgba(255,255,255,0.15)" }}>
          {name[0].toUpperCase()}
        </div>
      );
    }

    function Spinner() {
      return <div style={{ width:18, height:18, border:"2px solid rgba(255,255,255,0.15)",
        borderTopColor:"#FF6B6B", borderRadius:"50%", animation:"spin 0.7s linear infinite", display:"inline-block" }} />;
    }

    // ── Math ──────────────────────────────────────────────────────────────────
    function getShare(amount, splits, person) {
      const total = Object.values(splits).reduce((a,b)=>a+b, 0);
      if (!total || splits[person]==null) return 0;
      return (splits[person] / total) * amount;
    }

    function computeBalances(expenses, friends) {
      const bal = {};
      friends.forEach(f => bal[f] = 0);
      expenses.forEach(exp => {
        Object.keys(exp.splits).forEach(person => {
          if (person === exp.paid_by) return;
          const share = getShare(exp.amount, exp.splits, person);
          bal[exp.paid_by] = (bal[exp.paid_by]||0) + share;
          bal[person]      = (bal[person]||0) - share;
        });
      });
      return bal;
    }

    function computeRawDebts(expenses) {
      const debts = {};
      expenses.forEach(exp => {
        Object.keys(exp.splits).forEach(person => {
          if (person === exp.paid_by) return;
          const key = `${person}>${exp.paid_by}`;
          debts[key] = (debts[key]||0) + getShare(exp.amount, exp.splits, person);
        });
      });
      const result = [], seen = new Set();
      Object.entries(debts).forEach(([key, amt]) => {
        if (seen.has(key)) return;
        const [from, to] = key.split(">");
        const rev = `${to}>${from}`;
        const net = amt - (debts[rev]||0);
        seen.add(key); seen.add(rev);
        if      (net >  0.01) result.push({ from, to,   amount: net });
        else if (net < -0.01) result.push({ from: to, to: from, amount: -net });
      });
      return result;
    }

    function simplifyDebts(expenses, friends) {
      const bal = computeBalances(expenses, friends);
      const c = Object.entries(bal).filter(([,b])=>b>0.01).map(([name,amount])=>({name,amount})).sort((a,b)=>b.amount-a.amount);
      const d = Object.entries(bal).filter(([,b])=>b<-0.01).map(([name,amount])=>({name,amount:-amount})).sort((a,b)=>b.amount-a.amount);
      const cc=c.map(x=>({...x})), dd=d.map(x=>({...x})), txns=[];
      let i=0, j=0;
      while (i<cc.length && j<dd.length) {
        const amt = Math.min(cc[i].amount, dd[j].amount);
        txns.push({ from:dd[j].name, to:cc[i].name, amount:amt });
        cc[i].amount -= amt; dd[j].amount -= amt;
        if (cc[i].amount < 0.01) i++;
        if (dd[j].amount < 0.01) j++;
      }
      return txns;
    }

    // ── App ───────────────────────────────────────────────────────────────────
    function App() {
      const [friends,          setFriends]          = useState([]);
      const [expenses,         setExpenses]          = useState([]);
      const [agendaItems,      setAgendaItems]       = useState([]);
      const [notifications,    setNotifications]     = useState([]);
      const [tab,              setTab]               = useState("expenses");
      const [simplified,       setSimplified]        = useState(true);
      const [loading,          setLoading]           = useState(true);
      const [saving,           setSaving]            = useState(false);
      const [error,            setError]             = useState(null);
      const [showExpense,      setShowExpense]       = useState(false);
      const [editingExpense,   setEditingExpense]    = useState(null);
      const [expandedExpenses, setExpandedExpenses]  = useState(new Set());
      const [splitMode,        setSplitMode]         = useState("servings");
      const [showFriend,       setShowFriend]        = useState(false);
      const [newFriend,        setNewFriend]         = useState("");
      const [newTopic,         setNewTopic]          = useState("");
      const [addedBy,          setAddedBy]           = useState("");
      const [form,             setForm]              = useState({ description:"", amount:"", paid_by:"", splits:{} });
      const [myName,           setMyName]            = useState(() => localStorage.getItem("bbw_myname") || "");
      const [pushSub,          setPushSub]           = useState(null);
      const [showReleaseNotes,  setShowReleaseNotes]  = useState(false);
      const [settleModal,       setSettleModal]        = useState(null); // {from,to,amount}
      const [agendaCategory,    setAgendaCategory]      = useState('food'); // 'food'|'movies'|'other'
      const [movingItem,        setMovingItem]          = useState(null); // item being moved to new category
      const [pushLoading,      setPushLoading]       = useState(false);
      const [swReady,          setSwReady]           = useState(false);

      // Persist myName
      useEffect(() => {
        if (myName) localStorage.setItem("bbw_myname", myName);
        else localStorage.removeItem("bbw_myname");
      }, [myName]);

      // Register service worker
      useEffect(() => {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("sw.js")
            .then(() => {
              setSwReady(true);
              getPushSub().then(s => setPushSub(s));
            })
            .catch(e => console.warn("SW registration failed:", e));
        }
      }, []);

      // Load data
      const loadData = useCallback(async () => {
        setLoading(true); setError(null);
        try {
          const [fRows, eRows, sRows, aRows] = await Promise.all([
            sbFetch("/friends?order=created_at.asc&select=name"),
            sbFetch("/expenses?order=created_at.desc&select=id,description,amount,paid_by,date"),
            sbFetch("/expense_splits?select=expense_id,person_name,servings"),
            sbFetch("/agenda_items?order=created_at.asc&select=id,topic,added_by,status,category,created_at"),
          ]);
          const names = (fRows||[]).map(f=>f.name);
          const sm = {};
          (sRows||[]).forEach(s=>{ if(!sm[s.expense_id]) sm[s.expense_id]={}; sm[s.expense_id][s.person_name]=s.servings; });
          setFriends(names);
          setExpenses((eRows||[]).map(e=>({...e, amount:parseFloat(e.amount), splits:sm[e.id]||{}})));
          setAgendaItems(aRows||[]);
        } catch(e) { setError(e.message); }
        finally { setLoading(false); }
      }, []);

      useEffect(()=>{ loadData(); }, [loadData]);

      // Load notifications when on notifications tab
      const loadNotifications = useCallback(async () => {
        if (!myName) return;
        try {
          const rows = await sbFetch(`/notifications?recipient=eq.${encodeURIComponent(myName)}&order=created_at.desc&limit=50`);
          setNotifications(rows || []);
        } catch(e) { console.warn("notif load failed", e); }
      }, [myName]);

      useEffect(() => {
        if (tab === "notifications") loadNotifications();
      }, [tab, loadNotifications]);

      // ── CRUD ────────────────────────────────────────────────────────────────
      async function addFriend() {
        const name = newFriend.trim();
        if (!name || friends.includes(name)) return;
        setSaving(true);
        try {
          await sbFetch("/friends", { method:"POST", body:JSON.stringify({name}) });
          setFriends(p=>[...p, name]);
          setNewFriend(""); setShowFriend(false);
        } catch(e) { setError(e.message); } finally { setSaving(false); }
      }

      async function addExpense() {
        if (!form.description||!form.amount||!form.paid_by||!Object.keys(form.splits).length) return;
        const amt = parseFloat(form.amount);
        if (isNaN(amt)||amt<=0) return;
        setSaving(true);
        try {
          const [row] = await sbFetch("/expenses", { method:"POST", body:JSON.stringify({
            description:form.description, amount:amt, paid_by:form.paid_by,
            date:new Date().toISOString().split("T")[0]
          })});
          await sbFetch("/expense_splits", { method:"POST", body:JSON.stringify(
            Object.entries(form.splits).map(([person_name,servings])=>({ expense_id:row.id, person_name, servings: parseFloat(servings)||0 }))
          )});
          setExpenses(p=>[{...row, amount:parseFloat(row.amount), splits:{...form.splits}}, ...p]);
          setForm({description:"",amount:"",paid_by:"",splits:{}});
          setShowExpense(false);
          triggerNotify("expense_added", row, form.paid_by, Object.keys(form.splits));
        } catch(e) { setError(e.message); } finally { setSaving(false); }
      }

      async function updateExpense() {
        if (!form.description||!form.amount||!form.paid_by||!Object.keys(form.splits).length) return;
        const amt = parseFloat(form.amount);
        if (isNaN(amt)||amt<=0) return;
        setSaving(true);
        try {
          await sbFetch(`/expenses?id=eq.${editingExpense}`, { method:"PATCH",
            body:JSON.stringify({ description:form.description, amount:amt, paid_by:form.paid_by }) });
          await sbFetch(`/expense_splits?expense_id=eq.${editingExpense}`, { method:"DELETE", extraHeaders:{Prefer:""} });
          await sbFetch("/expense_splits", { method:"POST", body:JSON.stringify(
            Object.entries(form.splits).map(([person_name,servings])=>({ expense_id:editingExpense, person_name, servings: parseFloat(servings)||0 }))
          )});
          setExpenses(p=>p.map(e=>e.id===editingExpense
            ? {...e, description:form.description, amount:amt, paid_by:form.paid_by, splits:{...form.splits}} : e));
          triggerNotify("expense_edited", { description:form.description, amount:amt }, form.paid_by, Object.keys(form.splits));
          setEditingExpense(null); setShowExpense(false);
          setForm({description:"",amount:"",paid_by:"",splits:{}});
        } catch(e) { setError(e.message); } finally { setSaving(false); }
      }

      async function deleteExpense(id) {
        setSaving(true);
        try {
          await sbFetch(`/expenses?id=eq.${id}`, { method:"DELETE", extraHeaders:{Prefer:""} });
          setExpenses(p=>p.filter(e=>e.id!==id));
        } catch(e) { setError(e.message); } finally { setSaving(false); }
      }

      function openEdit(exp) {
        const vals = Object.values(exp.splits);
        // Custom amounts have decimals or are larger than typical serving counts
        const isCustom = vals.length > 0 && vals.some(v => !Number.isInteger(v) || v > 99);
        setSplitMode(isCustom ? "custom" : "servings");
        setForm({ description:exp.description, amount:String(exp.amount), paid_by:exp.paid_by, splits:{...exp.splits} });
        setEditingExpense(exp.id);
        setShowExpense(true);
      }

      async function addAgendaItem() {
        const topic = newTopic.trim();
        if (!topic) return;
        setSaving(true);
        try {
          const body = { topic, status:"pending", category: agendaCategory };
          if (addedBy.trim()) body.added_by = addedBy.trim();
          const [row] = await sbFetch("/agenda_items", { method:"POST", body:JSON.stringify(body) });
          setAgendaItems(p=>[...p, row]);
          setNewTopic(""); setAddedBy("");
          triggerNotify("agenda_added", row, addedBy || "Someone");
        } catch(e) { setError(e.message); } finally { setSaving(false); }
      }

      async function toggleAgenda(item) {
        const status = item.status==="pending" ? "discussed" : "pending";
        setSaving(true);
        try {
          await sbFetch(`/agenda_items?id=eq.${item.id}`, { method:"PATCH", body:JSON.stringify({status}) });
          setAgendaItems(p=>p.map(a=>a.id===item.id ? {...a,status} : a));
        } catch(e) { setError(e.message); } finally { setSaving(false); }
      }

      async function deleteAgendaItem(id) {
        setSaving(true);
        try {
          await sbFetch(`/agenda_items?id=eq.${id}`, { method:"DELETE", extraHeaders:{Prefer:""} });
          setAgendaItems(p=>p.filter(a=>a.id!==id));
        } catch(e) { setError(e.message); } finally { setSaving(false); }
      }

      async function moveAgendaItem(item, newCategory) {
        setSaving(true);
        try {
          await sbFetch(`/agenda_items?id=eq.${item.id}`, { method:"PATCH", body:JSON.stringify({ category: newCategory }) });
          setAgendaItems(p=>p.map(a=>a.id===item.id ? {...a, category:newCategory} : a));
          setMovingItem(null);
        } catch(e) { setError(e.message); } finally { setSaving(false); }
      }

      async function recordSettlement(from, to, amount) {
        // "from" owes "to" $amount.
        // To cancel: record "from" as payer, only "to" in the split.
        // Result: "to" owes 100% back to "from" = exactly cancels the original debt.
        setSaving(true);
        try {
          const [row] = await sbFetch("/expenses", { method:"POST", body:JSON.stringify({
            description: `💸 ${from} settled up with ${to}`,
            amount, paid_by: from,
            date: new Date().toISOString().split("T")[0]
          })});
          await sbFetch("/expense_splits", { method:"POST", body:JSON.stringify([
            { expense_id:row.id, person_name:to, servings:1 },
          ])});
          await loadData();
          setSettleModal(null);
        } catch(e) { setError(e.message); } finally { setSaving(false); }
      }

      async function markAllRead() {
        if (!myName) return;
        try {
          await sbFetch(`/notifications?recipient=eq.${encodeURIComponent(myName)}&read=eq.false`, {
            method:"PATCH", body:JSON.stringify({read:true})
          });
          setNotifications(p=>p.map(n=>({...n,read:true})));
        } catch(e) { console.warn(e); }
      }

      // ── Push subscription toggle ──────────────────────────────────────────
      async function togglePush() {
        if (!myName) { setError("Select your name in Settings first"); return; }
        setPushLoading(true);
        try {
          if (pushSub) {
            await unregisterPush();
            setPushSub(null);
          } else {
            const sub = await registerPush(myName);
            setPushSub(sub);
            if (!sub) setError("Notifications permission denied");
          }
        } catch(e) { setError(e.message); }
        finally { setPushLoading(false); }
      }

      // ── Form helpers ──────────────────────────────────────────────────────
      function togglePerson(name) {
        setForm(prev => {
          const splits = {...prev.splits};
          if (splits[name]!==undefined) delete splits[name]; else splits[name]=splitMode==='servings'?2:0;
          return {...prev, splits};
        });
      }
      function setServings(name, val) {
        const v = Math.max(1, Math.min(99, val));
        setForm(p=>({...p, splits:{...p.splits, [name]:v}}));
      }
      function toggleExpand(id) {
        setExpandedExpenses(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id); else next.add(id);
          return next;
        });

      const balances  = computeBalances(expenses, friends);
      const rawDebts  = computeRawDebts(expenses);
      const simpDebts = simplifyDebts(expenses, friends);
      const settle    = simplified ? simpDebts : rawDebts;

      const totalSrv  = Object.values(form.splits).reduce((a,b)=>a+b, 0);

      const pending   = agendaItems.filter(a=>a.status==="pending").length;
      const unreadCount = myName ? notifications.filter(n=>!n.read).length : 0;

      const TABS = [
        {id:"expenses",      icon:"💳", label:"Expenses"},
        {id:"balances",      icon:"⚖️",  label:"Balances"},
        {id:"settle",        icon:"🤝",  label:"Settle"},
        {id:"agenda",        icon:"📋",  label:"Agenda"},
        {id:"notifications", icon:"🔔",  label:"Alerts"},
        {id:"settings",      icon:"⚙️",  label:"Settings"},

      return (
        <>
          {/* ── Top header ── */}

            <div style={{ maxWidth:680, margin:"0 auto" }}>

                    BigBack<span style={{ color:"#FF6B6B" }}>Wise</span>
                  </h1>
                  {saving && <Spinner />}
                </div>
                <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                </div>
              </div>
              {loading
                ? <div style={{ display:"flex", gap:12 }}>{[1,2,3].map(i=><div key={i} className="skeleton" style={{ width:32, height:32, borderRadius:"50%", flexShrink:0 }}/>)}</div>

                    {friends.map(f=>{

                      );

            </div>
          </div>

            {error && (

            <div className="fade-in" key={tab}>

                    </div>

                  {expenses.map(exp=>{

                            </div>
                          </div>

                      </div>
                    );
                  })}
                </div>
              )}

                  <div style={{ display:"flex", flexDirection:"column", gap:10 }}>

              {tab==="agenda" && (
                <div>
                  {/* Category tabs */}
                  {(() => {

                                color:active?c.color:"#666", fontWeight:600, fontSize:12,

                                    </button>
                                    <div style={{ flex:1, minWidth:0 }}>
                                      <div style={{ fontSize:14, fontWeight:500, color:status==="discussed"?"#555":"#e8e8f0",
                                        textDecoration:status==="discussed"?"line-through":"none", lineHeight:1.4 }}>{item.topic}</div>
                                      {item.added_by && (

                      <div style={{ fontWeight:600, color:"#666" }}>Select your name in Settings</div>
                      <div style={{ fontSize:13, color:"#444", marginTop:4 }}>So we know whose notifications to show you</div>
                      <button className="btn btn-ghost" style={{ marginTop:16 }} onClick={()=>setTab("settings")}>Go to Settings</button>
                    </div>
                  ) : (
                    <>
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
                        <div style={{ fontWeight:700, color:"#fff" }}>Notifications for {myName}</div>
                        {notifications.some(n=>!n.read) && (
                          <button className="btn btn-ghost" style={{ fontSize:12, padding:"5px 11px" }} onClick={markAllRead}>Mark all read</button>
                        )}
                      </div>
                      {notifications.length===0 && (
                        <div style={{ textAlign:"center", color:"#555", padding:"60px 0" }}>
                          <div style={{ fontSize:36, marginBottom:10 }}>✅</div>
                          <div style={{ fontWeight:600, color:"#666" }}>All caught up!</div>
                        </div>
                      )}
                      <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                        {notifications.map(n=>(
                          <div key={n.id} className={`notif-item${n.read?"":" unread"}`}>
                            <div style={{ fontSize:22, flexShrink:0, lineHeight:1 }}>
                              {n.type==="expense"?"💳":n.type==="agenda"?"📋":"🤝"}
                            </div>
                            <div style={{ flex:1, minWidth:0 }}>
                              <div style={{ fontWeight:600, fontSize:14, color:"#fff" }}>{n.title}</div>
                              <div style={{ fontSize:13, color:"#888", marginTop:2, lineHeight:1.4 }}>{n.body}</div>
                              <div style={{ fontSize:11, color:"#444", marginTop:4 }}>
                                {new Date(n.created_at).toLocaleString()}
                              </div>
                            </div>
                            {!n.read && <div style={{ width:8, height:8, borderRadius:"50%", background:"#FF6B6B", flexShrink:0, marginTop:6 }}/>}
                          </div>
                        ))}
                      </div>
                    </>
                  )}
                </div>
              )}

              {/* ── SETTINGS ── */}
              {tab==="settings" && (
                <div style={{ display:"flex", flexDirection:"column", gap:16 }}>

                  {/* Who are you */}
                  <div className="card">
                    <div style={{ marginBottom:14 }}>
                      <div style={{ fontSize:16, fontWeight:700, color:"#fff", marginBottom:4 }}>Who are you?</div>
                      <div style={{ fontSize:13, color:"#666" }}>Pick your name so expenses are pre-filled and notifications are personalised.</div>
                    </div>
                    <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                      {friends.map(f => {
                        const isMe = myName === f;
                        const col  = getColor(f, friends);
                        return (
                          <button key={f} onClick={()=>setMyName(isMe?"":f)} style={{
                            display:"flex", alignItems:"center", gap:12,
                            padding:"12px 14px", borderRadius:12, width:"100%",
                            border:`2px solid ${isMe?col:"rgba(255,255,255,0.08)"}`,
                            background:isMe?`${col}15`:"rgba(255,255,255,0.03)",
                            cursor:"pointer", transition:"all 0.18s",
                          }}>
                            <Avatar name={f} friends={friends} size={36}/>
                            <span style={{ fontWeight:600, fontSize:15, color:isMe?"#fff":"#aaa", flex:1, textAlign:"left" }}>{f}</span>
                            {isMe && <span style={{ fontSize:12, fontWeight:700, color:col, background:`${col}20`, padding:"3px 10px", borderRadius:20 }}>That's me ✓</span>}
                          </button>
                        );
                      })}
                      {friends.length===0 && <div style={{ color:"#555", fontSize:13 }}>No friends added yet.</div>}
                    </div>
                    {myName && (
                      <button onClick={()=>setMyName("")} style={{ marginTop:14, background:"none", border:"none", color:"#555", cursor:"pointer", fontSize:13, fontFamily:"inherit", textDecoration:"underline" }}>
                        Clear selection
                      </button>
                    )}
                  </div>

                  {myName && (
                    <div style={{ padding:"12px 16px", background:"rgba(78,205,196,0.08)", border:"1px solid rgba(78,205,196,0.2)", borderRadius:12, fontSize:13, color:"#4ECDC4" }}>
                      ✓ New expenses will default to <strong>{myName}</strong> as the payer.
                    </div>
                  )}

                  {/* Push notifications */}
                  <div className="card">
                    <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:12 }}>
                      <div>
                        <div style={{ fontSize:16, fontWeight:700, color:"#fff", marginBottom:4 }}>Push Notifications</div>
                        <div style={{ fontSize:13, color:"#666", lineHeight:1.5 }}>
                          Get notified on this device when someone adds or edits an expense.
                          {!swReady && <span style={{ color:"#FF6B6B" }}> Requires sw.js file alongside the app.</span>}
                        </div>
                      </div>
                      <button
                        className={`toggle${pushSub?" on":""}`}
                        onClick={togglePush}
                        disabled={pushLoading||!swReady||!myName}
                        style={{ marginTop:4 }}>
                        <div className="toggle-thumb"/>
                      </button>
                    </div>
                    {pushSub && (
                      <div style={{ marginTop:12, padding:"8px 12px", background:"rgba(78,205,196,0.08)", borderRadius:10, fontSize:12, color:"#4ECDC4" }}>
                        🔔 Push notifications enabled for {myName}
                      </div>
                    )}
                    {!myName && (
                      <div style={{ marginTop:12, fontSize:12, color:"#666" }}>Select your name above to enable notifications.</div>
                    )}
                  </div>

                  {/* Release Notes */}
                  <div className="card" style={{ padding:"16px" }}>
                    <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                      <div>
                        <div style={{ fontSize:16, fontWeight:700, color:"#fff", marginBottom:2 }}>Release Notes</div>
                        <div style={{ fontSize:12, color:"#555" }}>What's new in BigBackWise</div>
                      </div>
                      <button className="btn btn-ghost" style={{ fontSize:12, padding:"6px 12px" }}
                        onClick={()=>setShowReleaseNotes(true)}>View →</button>
                    </div>
                  </div>
                </div>
              )}

            </div>
          </div>

          {/* ── FAB ── */}
          {tab!=="agenda" && tab!=="settings" && tab!=="notifications" && (
            <button id="fab"
              onClick={()=>{
                const payer = myName&&friends.includes(myName)?myName:"";
                setEditingExpense(null); setSplitMode("servings");
                setForm({description:"",amount:"",paid_by:payer,splits:Object.fromEntries(friends.map(n=>[n,2]))});
                setShowExpense(true);
              }}
              disabled={loading||friends.length===0}>+</button>
          )}

          {/* ── Bottom nav ── */}
          <div id="bottom-nav">
            {TABS.map(t=>(
              <button key={t.id} className={tab===t.id?"active":""} onClick={()=>setTab(t.id)}>
                <span className="icon">{t.icon}</span>
                <span className="label">{t.label}</span>
                {t.id==="agenda" && pending>0 && <span className="badge">{pending}</span>}
                {t.id==="notifications" && unreadCount>0 && <span className="badge">{unreadCount}</span>}
              </button>
            ))}
          </div>

          {/* ── Add / Edit Expense Modal ── */}
          {showExpense && (
            <div className="modal-overlay" onClick={e=>{ if(e.target===e.currentTarget){ setShowExpense(false); setEditingExpense(null); setForm({description:"",amount:"",paid_by:"",splits:{}}); }}}>
              <div className="modal">
                <h2 style={{ fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:20, marginBottom:18 }}>
                  {editingExpense?"Edit Expense":"Add Expense"}
                </h2>
                <div style={{ display:"flex", flexDirection:"column", gap:14 }}>

                  <div>
                    <label className="label">Description</label>
                    <input className="input" placeholder="e.g. Dinner, Uber, Groceries" value={form.description}
                      onChange={e=>setForm(f=>({...f, description:e.target.value}))}/>
                  </div>

                  <div>
                    <label className="label">Amount ($)</label>
                    <input className="input" type="number" inputMode="decimal" placeholder="0.00" min="0" step="0.01"
                      value={form.amount} onChange={e=>setForm(f=>({...f, amount:e.target.value}))}/>
                  </div>

                  <div>
                    <label className="label">Paid by</label>
                    <select className="input" value={form.paid_by} onChange={e=>{
                      const payer = e.target.value;
                      setForm(f=>({...f, paid_by:payer, splits:payer?{...f.splits,[payer]:f.splits[payer]||(splitMode==="servings"?2:0)}:f.splits}));
                    }}>
                      <option value="">Select person</option>
                      {friends.map(f=><option key={f} value={f}>{f}</option>)}
                    </select>
                  </div>

                  <div>
                    {/* Split mode toggle */}
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
                      <span className="label" style={{ margin:0 }}>Split</span>
                      <div style={{ display:"flex", background:"rgba(255,255,255,0.06)", borderRadius:8, padding:2, gap:2 }}>
                        {["servings","custom"].map(m=>(
                          <button key={m} onClick={()=>{
                            setSplitMode(m);
                            if (m==="custom"&&formAmt>0) {
                              const tot = Object.values(form.splits).reduce((a,b)=>a+b,0);
                              if (tot>0) setForm(f=>({...f, splits:Object.fromEntries(
                                Object.entries(f.splits).map(([n,v])=>[n, parseFloat(((v/tot)*formAmt).toFixed(2))])
                              )}));
                            }
                            if (m==="servings") setForm(f=>({...f, splits:Object.fromEntries(Object.keys(f.splits).map(n=>[n,2]))}));
                          }} style={{
                            background:splitMode===m?"rgba(255,255,255,0.12)":"none",
                            border:"none", color:splitMode===m?"#fff":"#666",
                            borderRadius:6, padding:"4px 10px", fontSize:12, fontWeight:600,
                            cursor:"pointer", fontFamily:"inherit", transition:"all 0.15s",
                          }}>
                            {m==="servings"?"× Servings":"$ Amount"}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Quick actions */}
                    <div style={{ display:"flex", justifyContent:"flex-end", gap:10, marginBottom:8 }}>
                      {splitMode==="servings" && (
                        <button style={{ background:"none", border:"none", color:"#888", cursor:"pointer", fontSize:12, fontFamily:"inherit" }}
                          onClick={()=>setForm(f=>({...f, splits:Object.fromEntries(friends.map(n=>[n,2]))}))}>All ×2</button>
                      )}
                      {splitMode==="custom"&&formAmt>0 && (
                        <button style={{ background:"none", border:"none", color:"#888", cursor:"pointer", fontSize:12, fontFamily:"inherit" }}
                          onClick={()=>{
                            const each = parseFloat((formAmt/Object.keys(form.splits).length).toFixed(2));
                            setForm(f=>({...f, splits:Object.fromEntries(Object.keys(f.splits).map(n=>[n,each]))}));
                          }}>Split evenly</button>
                      )}
                      <span style={{ color:"#333" }}>·</span>
                      <button style={{ background:"none", border:"none", color:"#888", cursor:"pointer", fontSize:12, fontFamily:"inherit" }}
                        onClick={()=>setForm(f=>({...f, splits:f.paid_by?{[f.paid_by]:splitMode==="servings"?2:0}:{}}))}>Clear</button>
                    </div>

                    {/* Person rows */}
                    <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
                      {friends.map(name=>{
                        const isPayer = name===form.paid_by;
                        const isIn    = form.splits[name]!==undefined;
                        const srv     = form.splits[name]||(splitMode==="servings"?2:0);
                        const col     = getColor(name, friends);
                        const share   = splitMode==="servings"
                          ? (isIn&&formAmt>0&&totalSrv>0?(srv/totalSrv)*formAmt:null)
                          : (isIn?srv:null);
                        return (
                          <div key={name} style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 10px", borderRadius:12,
                            border:`1.5px solid ${isIn?`${col}40`:"transparent"}`,
                            background:isIn?`${col}0d`:"transparent", transition:"all 0.15s" }}>
                            <div onClick={()=>togglePerson(name)}
                              style={{ display:"flex", alignItems:"center", gap:8, flex:1, cursor:"pointer", userSelect:"none" }}>
                              <div style={{ width:22, height:22, borderRadius:6,
                                border:`2px solid ${isIn?col:"#3a3a4a"}`, background:isIn?col:"transparent",
                                display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                                {isIn && <span style={{ color:"#0f0f1a", fontSize:13, fontWeight:900 }}>✓</span>}
                              </div>
                              <Avatar name={name} friends={friends} size={24}/>
                              <span style={{ fontWeight:600, fontSize:14, color:isIn?"#fff":"#555" }}>{name}</span>
                              {isPayer&&<span style={{ fontSize:10, color:col, background:`${col}20`, padding:"1px 6px", borderRadius:8, fontWeight:700 }}>payer</span>}
                            </div>
                            {isIn ? (
                              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                                {splitMode==="servings" ? (
                                  <>
                                    {share!==null&&<span style={{ fontSize:13, fontWeight:700, color:"#aaa", minWidth:48, textAlign:"right" }}>${share.toFixed(2)}</span>}
                                    <div className="serving-ctrl">
                                      <button className="serving-btn" onClick={e=>{e.stopPropagation();setServings(name,srv-1);}}>−</button>
                                      <span className="serving-val">{srv}</span>
                                      <button className="serving-btn" onClick={e=>{e.stopPropagation();setServings(name,srv+1);}}>+</button>
                                    </div>
                                  </>
                                ) : (
                                  <div style={{ display:"flex", alignItems:"center", gap:4 }}>
                                    <span style={{ color:"#888", fontSize:14 }}>$</span>
                                    <input type="number" inputMode="decimal" min="0" step="0.01"
                                      value={srv===0?"":srv} placeholder="0.00"
                                      onClick={e=>e.stopPropagation()}
                                      onChange={e=>{ const v=parseFloat(e.target.value)||0; setForm(f=>({...f,splits:{...f.splits,[name]:v}})); }}
                                      style={{ width:72, background:"rgba(255,255,255,0.08)", border:"1px solid rgba(255,255,255,0.15)",
                                        borderRadius:8, padding:"5px 8px", color:"#fff", fontSize:14,
                                        fontFamily:"inherit", outline:"none", textAlign:"right" }}/>
                                  </div>
                                )}
                              </div>
                            ) : (
                              <span style={{ fontSize:12, color:"#3a3a4a" }}>tap to add</span>
                            )}
                          </div>
                        );
                      })}
                    </div>

                    {/* Breakdown */}
                    {Object.keys(form.splits).length>0&&formAmt>0 && (
                      <div style={{ marginTop:10, padding:"11px 13px", background:"rgba(255,255,255,0.03)", borderRadius:11, border:"1px solid rgba(255,255,255,0.07)" }}>
                        <div style={{ fontSize:10, color:"#555", fontWeight:700, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:7 }}>Breakdown</div>
                        {Object.entries(form.splits).map(([name,srv])=>{
                          const share = splitMode==="servings"?(srv/totalSrv)*formAmt:srv;
                          const col   = getColor(name, friends);
                          return (
                            <div key={name} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"2px 0" }}>
                              <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                                <Avatar name={name} friends={friends} size={16}/>
                                <span style={{ fontSize:13, color:"#ccc" }}>{name}</span>
                                {splitMode==="servings"&&<span style={{ fontSize:10, color:"#555", background:`${col}18`, padding:"1px 5px", borderRadius:6 }}>×{srv}</span>}
                              </div>
                              <span style={{ fontSize:13, fontWeight:700, color:"#fff" }}>${share.toFixed(2)}</span>
                            </div>
                          );
                        })}
                        <div style={{ borderTop:"1px solid rgba(255,255,255,0.06)", marginTop:7, paddingTop:7, display:"flex", justifyContent:"space-between" }}>
                          {splitMode==="servings"
                            ? <span style={{ fontSize:11, color:"#555" }}>{totalSrv} servings</span>
                            : (()=>{
                                const ct  = Object.values(form.splits).reduce((a,b)=>a+b,0);
                                const diff = formAmt - ct;
                                return <span style={{ fontSize:11, color:Math.abs(diff)>0.01?"#FF6B6B":"#4ECDC4" }}>
                                  {Math.abs(diff)<0.01?"✓ Balanced":diff>0?`$${diff.toFixed(2)} unassigned`:`$${Math.abs(diff).toFixed(2)} over`}
                                </span>;
                              })()
                          }
                          <span style={{ fontSize:13, fontWeight:800, color:"#FF6B6B" }}>${formAmt.toFixed(2)}</span>
                        </div>
                      </div>
                    )}
                  </div>

                  <div style={{ display:"flex", gap:10 }}>
                    <button className="btn btn-ghost" style={{ flex:1 }}
                      onClick={()=>{ setShowExpense(false); setEditingExpense(null); setForm({description:"",amount:"",paid_by:"",splits:{}}); }}>Cancel</button>
                    <button className="btn btn-primary" style={{ flex:2 }} onClick={editingExpense?updateExpense:addExpense} disabled={saving}>
                      {saving?<Spinner/>:editingExpense?"Save Changes":"Add Expense"}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ── Add Friend Modal ── */}
          {showFriend && (
            <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setShowFriend(false)}>
              <div className="modal" style={{ maxWidth:360 }}>
                <h2 style={{ fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:20, marginBottom:16 }}>Add Friend</h2>
                <input className="input" placeholder="Friend's name" value={newFriend} autoFocus
                  onChange={e=>setNewFriend(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&addFriend()}/>
                <div style={{ display:"flex", gap:10, marginTop:14 }}>
                  <button className="btn btn-ghost" style={{ flex:1 }} onClick={()=>setShowFriend(false)}>Cancel</button>
                  <button className="btn btn-primary" style={{ flex:2 }} onClick={addFriend} disabled={saving}>
                    {saving?<Spinner/>:"Add Friend"}
                  </button>
                </div>
              </div>
            </div>
          )}
          {/* ── Release Notes Modal ── */}
          {showReleaseNotes && (
            <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setShowReleaseNotes(false)}>
              <div className="modal" style={{ maxWidth:480 }}>
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:20 }}>
                  <h2 style={{ fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:20 }}>Release Notes</h2>
                  <button onClick={()=>setShowReleaseNotes(false)}
                    style={{ background:"none", border:"none", color:"#555", cursor:"pointer", fontSize:20, lineHeight:1 }}>✕</button>
                </div>
                <div style={{ display:"flex", flexDirection:"column", gap:20 }}>
                  {[
                    {
                      version:"v1.7", date:"Apr 2026",
                      changes:["Custom split amounts ($) per person in addition to servings", "Collapsible expense cards — tap to expand details", "Fixed: payer can now be removed from their own split"]
                    },
                    {
                      version:"v1.6", date:"Apr 2026",
                      changes:["Edit existing expenses (description, amount, splits)", "Settings tab: pick who you are for auto-filled Paid By", "Simplify debts on by default"]
                    },
                    {
                      version:"v1.5", date:"Apr 2026",
                      changes:["All friends pre-selected when adding a new expense", "Settings page with identity selection persisted to device"]
                    },
                    {
                      version:"v1.4", date:"Mar 2026",
                      changes:["Agenda tab with topic tracking and discussed/pending status", "Mobile-first layout with sticky header and bottom nav", "Floating + button for quick expense entry"]
                    },
                    {
                      version:"v1.3", date:"Mar 2026",
                      changes:["Fixed expense splitting bug where payer wasn't included in split calculation", "Renamed app to BigBackWise"]
                    },
                    {
                      version:"v1.0", date:"Feb 2026",
                      changes:["Initial release: expense tracking, proportional splits, debt simplification, Supabase persistence"]
                    },
                  ].map(r=>(
                    <div key={r.version}>
                      <div style={{ display:"flex", alignItems:"baseline", gap:10, marginBottom:8 }}>
                        <span style={{ fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:15, color:"#FF6B6B" }}>{r.version}</span>
                        <span style={{ fontSize:12, color:"#555" }}>{r.date}</span>
                      </div>
                      <div style={{ display:"flex", flexDirection:"column", gap:5 }}>
                        {r.changes.map((c,i)=>(
                          <div key={i} style={{ display:"flex", gap:8, fontSize:13, color:"#bbb", lineHeight:1.4 }}>
                            <span style={{ color:"#4ECDC4", flexShrink:0 }}>·</span>
                            <span>{c}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* ── Settle Confirmation Modal ── */}
          {settleModal && (
            <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setSettleModal(null)}>
              <div className="modal" style={{ maxWidth:360 }}>
                <h2 style={{ fontFamily:"'Syne',sans-serif", fontWeight:800, fontSize:20, marginBottom:6 }}>Mark as Paid</h2>
                <p style={{ fontSize:13, color:"#666", marginBottom:20 }}>
                  This will record a settlement and clear the debt from the balances.
                </p>
                <div style={{ padding:"16px", background:"rgba(255,255,255,0.04)", borderRadius:12, marginBottom:20, textAlign:"center" }}>
                  <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:10, flexWrap:"wrap" }}>
                    <Avatar name={settleModal.from} friends={friends} size={36}/>
                    <div>
                      <div style={{ fontWeight:700, color:"#fff" }}>{settleModal.from}</div>
                      <div style={{ fontSize:12, color:"#555" }}>pays</div>
                    </div>
                    <div style={{ fontWeight:800, fontSize:22, color:"#4ECDC4" }}>${settleModal.amount.toFixed(2)}</div>
                    <div>
                      <div style={{ fontSize:12, color:"#555" }}>to</div>
                      <div style={{ fontWeight:700, color:"#fff" }}>{settleModal.to}</div>
                    </div>
                    <Avatar name={settleModal.to} friends={friends} size={36}/>
                  </div>
                </div>
                <div style={{ display:"flex", gap:10 }}>
                  <button className="btn btn-ghost" style={{ flex:1 }} onClick={()=>setSettleModal(null)}>Cancel</button>
                  <button className="btn btn-primary" style={{ flex:2 }}
                    onClick={()=>recordSettlement(settleModal.from, settleModal.to, settleModal.amount)}
                    disabled={saving}>
                    {saving?<Spinner/>:"✓ Confirm Payment"}
                  </button>
                </div>
              </div>
            </div>
          )}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
